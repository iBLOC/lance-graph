name: Build
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/build.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C debuginfo=1"
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"

jobs:
  linux-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # 显式选工具链。仓根 rust-toolchain.toml 钉的是 1.94（MSRV 地板），
      # 目录覆盖会盖过 `rustup default` ⇒ 矩阵若不显式声明，跑的其实是 1.94
      # 而不是矩阵那一格 —— 那就是「矩阵写着 stable、实际跑别的」。
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    strategy:
      matrix:
        toolchain:
          # 1.94 = 地板（lance 14 的 rust-version = 1.94.0）；
          # stable = 最新能跑。两格都要，别只留一格。
          - "1.94"
          - stable
    steps:
      - uses: actions/checkout@v4
      - name: Setup rust toolchain
        run: |
          rustup toolchain install ${{ matrix.toolchain }}
          rustup default ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "lance-graph-deps"
          workspaces: |
            crates/lance-graph
            crates/lance-graph-python
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler
      - name: Build
        run: cargo build --manifest-path crates/lance-graph/Cargo.toml
      - name: Build tests
        run: cargo test --manifest-path crates/lance-graph/Cargo.toml --no-run
      - name: Run tests
        run: cargo test --manifest-path crates/lance-graph/Cargo.toml
      - name: Check benchmarks
        run: cargo check --manifest-path crates/lance-graph/Cargo.toml --benches
