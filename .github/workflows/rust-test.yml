name: Rust Tests
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/rust-test.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C debuginfo=1"
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # 显式选工具链 —— 仓根 rust-toolchain.toml 钉 1.94，目录覆盖会盖过
      # `rustup default` ⇒ 矩阵若不显式声明，跑的就不是矩阵那一格。
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    strategy:
      matrix:
        toolchain:
          # 1.94 = 地板（lance 14 的 rust-version = 1.94.0）；stable = 最新能跑。
          - "1.94"
          - stable
    steps:
      - uses: actions/checkout@v4
      - name: Setup rust toolchain
        run: |
          rustup toolchain install ${{ matrix.toolchain }}
          rustup default ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "lance-graph-deps"
          workspaces: |
            crates/lance-graph
            crates/lance-graph-python
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler
      - name: Build tests
        run: cargo test --manifest-path crates/lance-graph/Cargo.toml --no-run
      - name: Run unit tests
        run: cargo test --manifest-path crates/lance-graph/Cargo.toml --lib
      - name: Run integration tests
        run: cargo test --manifest-path crates/lance-graph/Cargo.toml --tests
      - name: Run doc tests
        run: cargo test --manifest-path crates/lance-graph/Cargo.toml --doc

  test-with-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # 覆盖率那格显式留在 stable（与加 toolchain 文件之前一致）——
      # 仓根那份文件钉的是 1.94 地板。
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - name: Setup rust toolchain
        run: |
          rustup toolchain install stable
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "lance-graph-deps"
          workspaces: |
            crates/lance-graph
            crates/lance-graph-python
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run tests with coverage
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          cargo llvm-cov --manifest-path crates/lance-graph/Cargo.toml --lib --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          flags: rust-unittests
          fail_ci_if_error: false
